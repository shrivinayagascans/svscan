        // Enhanced validation functions
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Updated phone validation function with leading zero check
        function validatePhone(number, countryCode) {
            // Remove non-digit characters from the phone number
            const cleanNumber = number.replace(/\D/g, '');

            // Check if the number starts with 0
            if (cleanNumber.charAt(0) === '0') {
                return false;
            }

            // For India: exactly 10 digits
            if (countryCode === "+91") {
                return cleanNumber.length === 10;
            }

            // For other countries: at least 6 digits and at most 15 digits (international standard)
            return cleanNumber.length >= 6 && cleanNumber.length <= 15;
        }

        function validateName(name) {
            // Check if name contains any numbers
            if (/\d/.test(name)) {
                return {
                    valid: false,
                    error: "Only Alpha & Special Characters allowed"
                };
            }

            // Check if name exceeds 50 characters
            if (name.length > 50) {
                return {
                    valid: false,
                    error: "Exceeds 50 characters"
                };
            }

            // Check if name contains only allowed characters
            const nameRegex = /^[a-zA-Z\s'.,-]+$/;
            if (!nameRegex.test(name)) {
                return {
                    valid: false,
                    error: "Invalid format"
                };
            }

            return {
                valid: true,
                error: ""
            };
        }

        function validateMessage(message) {
            return message.length <= 500;
        }

        async function getUserCountry() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return data.country_code || 'IN'; // Default to India if detection fails
            } catch (error) {
                console.error('Error detecting country:', error);
                return 'IN'; // Default to India if detection fails
            }
        }

            const textareaError = form.querySelector('#textareaError');
            const loaderElement = formIdSuffix ?
                document.getElementById(`loader${formIdSuffix}`) :

            const successMessageElement = formIdSuffix ?

            // Replace the phone input with country code dropdown and phone input

            $(lastnameField).attr('maxlength', '50');
            $(emailField).attr('maxlength', '100');
            $(messageField).attr('maxlength', '500');

            // Add real-time validation for name fields
            $(nameField).on('input', function () {
                if (this.value.trim()) {
                    const result = validateName(this.value.trim());
                    if (!result.valid) {
                        nameError.textContent = result.error;
                        nameError.style.display = 'block';
                    } else {

                    }
                } else {
                    nameError.textContent = "";

            // Last name validation - should not show error unless user has entered something invalid

                        lastnameError.style.display = 'none';
                    }
                } else {
                    lastnameError.textContent = "";
                    lastnameError.style.display = 'none';
                }
            });

            // Add character counter for message
            $(messageField).on('input', function () {
                const maxLength = 500;
                const currentLength = $(this).val().length;
                const remainingChars = maxLength - currentLength;

                // Update or create character counter
                let counterElement = $(this).next('.char-counter');
                if (counterElement.length === 0) {
                    $(this).after('<small class="char-counter text-muted"></small>');
                    counterElement = $(this).next('.char-counter');
                }

                counterElement.text(`${currentLength}/${maxLength} characters`);

                // Visual feedback when approaching limit
                if (remainingChars <= 50) {
                    counterElement.removeClass('text-muted').addClass('text-warning');
                } else {
                    counterElement.removeClass('text-warning').addClass('text-muted');
                }

                // Show error if exceeding limit
                if (currentLength > maxLength) {
                    textareaError.textContent = "Message exceeds 500 characters";
                    textareaError.style.display = 'block';
                } else {
                    textareaError.textContent = "";
                    textareaError.style.display = 'none';
                }
            });

            // Add form submission handler
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const submitButton = this.querySelector('button[type="submit"]');
                const originalButtonText = submitButton.textContent;
                submitButton.textContent = "Loading...";
                submitButton.disabled = true;

                if (loaderElement) {
                    loaderElement.style.display = "block";
                }

                let isValid = true;

                // First Name validation
                if (!nameField.value.trim()) {
                    nameError.textContent = "Required *";
                    nameError.style.display = 'block';
                    isValid = false;
                } else {
                    const nameResult = validateName(nameField.value.trim());
                    if (!nameResult.valid) {
                        nameError.textContent = nameResult.error;
                        nameError.style.display = 'block';
                        isValid = false;
                    } else {
                        nameError.textContent = "";
                        nameError.style.display = 'none';
                    }
                }

                // Last Name validation - OPTIONAL
                // Only validate if user has entered something
                if (lastnameField.value.trim()) {
                    const lastnameResult = validateName(lastnameField.value.trim());
                    if (!lastnameResult.valid) {
                        lastnameError.textContent = lastnameResult.error;
                        lastnameError.style.display = 'block';
                        isValid = false;
                    } else {
                        lastnameError.textContent = "";
                        lastnameError.style.display = 'none';
                    }
                } else {
                    // Clear any error if field is empty since it's optional
                    lastnameError.textContent = "";
                    lastnameError.style.display = 'none';
                }

                // Email validation
                if (!emailField.value.trim()) {
                    emailError.textContent = "Required *";
                    emailError.style.display = 'block';
                    isValid = false;
                } else if (!validateEmail(emailField.value.trim())) {
                    emailError.textContent = "Invalid email format";
                    emailError.style.display = 'block';
                    isValid = false;
                } else if (emailField.value.trim().length > 100) {
                    emailError.textContent = "Email exceeds 100 characters";
                    emailError.style.display = 'block';
                    isValid = false;
                } else {
                    emailError.textContent = "";
                    emailError.style.display = 'none';
                }

                // Get the country code and phone number
                const countryCodeElement = form.querySelector('#country-code');
                const phoneInputElement = form.querySelector('#phone');
                const countryCode = countryCodeElement ? countryCodeElement.value : "+91";

                // Phone validation with check for leading zero
                if (!phoneInputElement.value.trim()) {
                    phoneError.textContent = "Required *";
                    phoneError.style.display = 'block';
                    isValid = false;
                } else if (phoneInputElement.value.trim().charAt(0) === '0') {

                    phoneError.style.display = 'block';
                    isValid = false;
                } else if (!validatePhone(phoneInputElement.value.trim(), countryCode)) {
                    if (countryCode === "+91") {
                        phoneError.textContent = "Please enter a valid 10-digit phone number";
                    } else {
                        phoneError.textContent = "Please enter a valid phone number";
                    }
                    phoneError.style.display = 'block';
                    isValid = false;
                } else {
                    phoneError.textContent = "";
                    phoneError.style.display = 'none';
                }

                // Message validation
                if (!messageField.value.trim()) {
                    textareaError.textContent = "Required *";
                    textareaError.style.display = 'block';
                    isValid = false;
                } else if (!validateMessage(messageField.value.trim())) {
                    textareaError.textContent = "Message exceeds 500 characters";
                    textareaError.style.display = 'block';
                    isValid = false;
                } else {
                    textareaError.textContent = "";
                    textareaError.style.display = 'none';
                }

                if (isValid) {
                    var formObject = new FormData();

                    // Create email body with conditional lastname
                    var body = `Name: ${nameField.value}`;
                    if (lastnameField.value.trim()) {
                        body += `\nLastname: ${lastnameField.value}`;
                    }
                    body += `\nPhone Number: ${countryCode} ${phoneInputElement.value}\nEmail: ${emailField.value}\nMessage: ${messageField.value}`;

                    formObject.append("Body", body);
                    formObject.append("Subject", "Contact Form Submission");
                    formObject.append("ToEmail", globalConfig.ToEmail);

                    // Save form data for lead management
                    const formData = {
                        name: nameField.value,
                        lastname: lastnameField.value,
                        email: emailField.value,
                        message: messageField.value,
                        phone: `${countryCode} ${phoneInputElement.value}`
                    };

                    // Reset form fields
                    nameField.value = "";
                    lastnameField.value = "";
                    emailField.value = "";
                    phoneInputElement.value = "";
                    messageField.value = "";

                    // Clear error messages
                    nameError.textContent = "";
                    lastnameError.textContent = "";
                    emailError.textContent = "";
                    phoneError.textContent = "";
                    textareaError.textContent = "";

                    // Reset character counter if exists
                    $('.char-counter', form).text("0/500 characters").removeClass('text-warning').addClass('text-muted');

                    console.log("Form validated, sending data to email API and AddWebLead");
                    sendData(formObject, formData, form, submitButton, loaderElement, successMessageElement);
                } else {
                    if (loaderElement) {
                        loaderElement.style.display = "none";
                    }
                    resetSubmitButton(submitButton, originalButtonText);
                }
            });
        }

        // Create phone input with country code dropdown and flags
        function setupPhoneWithCountryCode(phoneField, phoneContainer, userCountry, form) {
            // Create a unique ID for this form's dropdown
            const uniqueId = Math.random().toString(36).substring(2, 10);

            // Get default country code
            const defaultCountry = countryCodes.find(c => c.iso === userCountry) ||
                countryCodes.find(c => c.iso === "IN"); // Default to India

            // Create container for phone field
            const phoneInputContainer = document.createElement('div');
            phoneInputContainer.className = 'phone-input-container';

            // Create country code dropdown button with flag
            const countryCodeDropdown = document.createElement('div');
            countryCodeDropdown.className = 'country-code-dropdown d-flex align-items-center';
            countryCodeDropdown.innerHTML = `
			<input type="hidden" id="country-code" value="${defaultCountry.code}">
			<div class="selected-country">
				<div class="d-flex align-items-center">
					<img src="https://flagcdn.com/w40/${defaultCountry.iso.toLowerCase()}.png" 
						class="flag-icon" alt="${defaultCountry.country} flag">
					<span id="selected-country-code">${defaultCountry.code}</span>
				</div>
			</div>
		`;

            // Create dropdown content
            const dropdownContent = document.createElement('div');
            dropdownContent.className = 'country-dropdown';
            dropdownContent.id = `country-dropdown-${uniqueId}`;

            // Add search input to dropdown
            const searchContainer = document.createElement('div');
            searchContainer.className = 'country-search';
            searchContainer.innerHTML = `
			<input type="text" placeholder="Search country..." id="country-search-${uniqueId}">
		`;
            dropdownContent.appendChild(searchContainer);

            // Add country options with flags
            countryCodes.sort((a, b) => a.country.localeCompare(b.country)).forEach(country => {
                const option = document.createElement('div');
                option.className = 'country-option';
                if (country.iso === defaultCountry.iso) {
                    option.className += ' active';
                }
                option.setAttribute('data-code', country.code);
                option.setAttribute('data-country', country.country);
                option.setAttribute('data-iso', country.iso);
                option.innerHTML = `
				<img src="https://flagcdn.com/w40/${country.iso.toLowerCase()}.png" 
					class="flag-icon" alt="${country.country} flag">
				<span class="country-code">${country.code}</span>
				<span class="country-name">${country.country}</span>
			`;
                dropdownContent.appendChild(option);
            });

            // Create new phone input
            const newPhoneInput = document.createElement('input');
            newPhoneInput.type = 'tel';
            newPhoneInput.id = 'phone';
            newPhoneInput.name = 'phone';
            newPhoneInput.className = phoneField.className;
            newPhoneInput.placeholder = phoneField.placeholder;
            newPhoneInput.setAttribute('maxlength', '15');

            // Only allow valid numbers in phone input with leading zero check
            $(newPhoneInput).on('input', function () {
                // Store cursor position
                const cursorPos = this.selectionStart;
                const oldValue = this.value;

                // Remove non-digits
                this.value = this.value.replace(/\D/g, '');

                // Check for leading zero and remove it
                if (this.value.charAt(0) === '0') {
                    // Show error message
                    const phoneErrorElement = form.querySelector('#phoneError');
                    if (phoneErrorElement) {

                        phoneErrorElement.style.display = 'block';
                    }

                    // Remove the leading zero
                    this.value = this.value.substring(1);
                } else {
                    // Clear error if no leading zero
                    const phoneErrorElement = form.querySelector('#phoneError');
                    if (phoneErrorElement) {
                        phoneErrorElement.textContent = "";
                        phoneErrorElement.style.display = 'none';
                    }
                }

                // Get selected country code
                const selectedCode = form.querySelector('#country-code').value;

                // For India: limit to 10 digits
                if (selectedCode === "+91" && this.value.length > 10) {
                    this.value = this.value.slice(0, 10);
                }
                // For other countries: limit to 15 digits (international standard)
                else if (this.value.length > 15) {
                    this.value = this.value.slice(0, 15);
                }

                // Adjust cursor position if value changed
                if (this.value !== oldValue) {
                    // If we removed a zero at the beginning, adjust cursor position
                    if (oldValue.charAt(0) === '0' && cursorPos > 0) {
                        this.setSelectionRange(cursorPos - 1, cursorPos - 1);
                    } else {
                        this.setSelectionRange(cursorPos, cursorPos);
                    }
                }
            });

            // Append elements to container
            phoneInputContainer.appendChild(countryCodeDropdown);
            phoneInputContainer.appendChild(newPhoneInput);

            // Replace original phone field with the new container
            phoneField.replaceWith(phoneInputContainer);

            // Append dropdown to body for proper z-index handling
            document.body.appendChild(dropdownContent);

            // Toggle dropdown on click
            countryCodeDropdown.addEventListener('click', function (e) {
                e.stopPropagation();

                // Close all other open dropdowns first
                document.querySelectorAll('.country-dropdown').forEach(dropdown => {
                    if (dropdown.id !== `country-dropdown-${uniqueId}`) {
                        dropdown.style.display = 'none';
                    }
                });

                // Position dropdown below the button
                const rect = countryCodeDropdown.getBoundingClientRect();
                dropdownContent.style.top = (rect.bottom + window.scrollY) + 'px';
                dropdownContent.style.left = (rect.left + window.scrollX) + 'px';

                // Toggle display
                if (dropdownContent.style.display === 'block') {
                    dropdownContent.style.display = 'none';
                } else {
                    dropdownContent.style.display = 'block';
                    // Focus search field
                    document.getElementById(`country-search-${uniqueId}`).focus();
                }
            });

            // Handle country selection
            const countryOptions = dropdownContent.querySelectorAll('.country-option');
            countryOptions.forEach(option => {
                option.addEventListener('click', function () {
                    const code = this.getAttribute('data-code');
                    const iso = this.getAttribute('data-iso');
                    const countryName = this.getAttribute('data-country');

                    // Update hidden input value
                    form.querySelector('#country-code').value = code;

                    // Update dropdown button with flag and code
                    const selectedCountryElement = countryCodeDropdown.querySelector('.selected-country div');
                    selectedCountryElement.innerHTML = `
					<img src="https://flagcdn.com/w40/${iso.toLowerCase()}.png" 
						class="flag-icon" alt="${countryName} flag">
					<span id="selected-country-code">${code}</span>
				`;

                    // Update active class
                    countryOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');

                    // Hide dropdown
                    dropdownContent.style.display = 'none';

                    // Clear phone field if country changes, since validation rules differ
                    newPhoneInput.value = '';

                    // Focus on phone input after selection
                    newPhoneInput.focus();
                });
            });

            // Handle search functionality
            const searchInput = document.getElementById(`country-search-${uniqueId}`);
            searchInput.addEventListener('input', function () {
                const searchText = this.value.toLowerCase();
                countryOptions.forEach(option => {
                    const country = option.getAttribute('data-country').toLowerCase();
                    const code = option.getAttribute('data-code');
                    if (country.includes(searchText) || code.includes(searchText)) {
                        option.style.display = 'flex';
                    } else {
                        option.style.display = 'none';
                    }
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function (e) {
                if (dropdownContent.style.display === 'block' &&
                    !countryCodeDropdown.contains(e.target) &&
                    !dropdownContent.contains(e.target)) {
                    dropdownContent.style.display = 'none';
                }
            });

            // Create error display element for phone field if not exists
            if (!form.querySelector('#phoneError')) {
                const errorElement = document.createElement('span');
                errorElement.id = 'phoneError';
                errorElement.className = 'error text-danger';
                phoneInputContainer.insertAdjacentElement('afterend', errorElement);
            }
        }

        // Enhanced function to add flag fallback
        function handleImageError(img) {
            img.onerror = null; // Prevent infinite loop
            img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="13" viewBox="0 0 24 16"><rect width="20" height="13" fill="%23ccc"/><text x="12" y="12" font-size="10" text-anchor="middle" fill="%23666">?</text></svg>';
            img.alt = 'Flag unavailable';
        }

        // Send form data to API
        function sendData(formObject, formData, form, submitButton, loaderElement, successMessageElement) {
            var apiEndpoint = globalConfig.APIUrl;
            console.log("APIUrl:", apiEndpoint);

            // Always send to lead management regardless of email success
            sendToLeadManagement(formData);

            // Send AJAX request for email
            $.ajax({
                url: apiEndpoint,
                type: "POST",
                data: formObject,
                contentType: false,
                processData: false,
                success: function (response) {
                    console.log("Email sent successfully:", response);

                    // Hide loader if it exists
                    if (loaderElement) {
                        loaderElement.style.display = "none";
                    }

                    // Reset button
                    resetSubmitButton(submitButton, "Submit");

                    // Show thank you message
                    showThankYouMessage(form);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.error("Email sending error:", textStatus, errorThrown);

                    // Hide loader if it exists
                    if (loaderElement) {
                        loaderElement.style.display = "none";
                    }

                    // Reset button
                    resetSubmitButton(submitButton, "Submit");

                    // Show thank you message anyway, since lead management is separate
                    showThankYouMessage(form);
                }
            });
        }

        function showThankYouMessage(form) {
            // Find the form container
            const formContainer = form.closest('.form-container') || form.parentElement;

            // Create thank you message element
            const thankYouMessage = document.createElement('div');
            thankYouMessage.className = 'alert alert-success mt-3';
            thankYouMessage.style.backgroundColor = '#d4edda';
            thankYouMessage.style.color = '#155724';
            thankYouMessage.style.padding = '15px';
            thankYouMessage.style.borderRadius = '5px';
            thankYouMessage.style.marginBottom = '15px';
            thankYouMessage.innerHTML = '<p style="margin: 0; text-align: center;">Thanks for reaching out! We\'ll be in touch.</p>';

            // Hide the form
            form.style.display = 'none';

            // Insert thank you message where the form was
            formContainer.appendChild(thankYouMessage);

            // Optionally scroll to the thank you message
            thankYouMessage.scrollIntoView({ behavior: 'smooth' });

            // You can set a timeout to redirect the user after some time if needed
            // setTimeout(function() { window.location.href = '/thank-you'; }, 3000);
        }


        // Send data to lead management system
        function sendToLeadManagement(formData) {
            if (!globalConfig.LeadManagment) {
                console.error("Lead Management URL not found in config");
                return;
            }

            // Create a more complete lead payload - handle empty lastname
            const leadPayload = {
                "Name": formData.lastname.trim() ? `${formData.name} ${formData.lastname}` : formData.name,
                "EmailID": formData.email,
                "Notes": formData.message || "",
                "PhoneNumber": formData.phone || "",
                "Source": "Website Contact Form"
            };

            console.log("Sending AddWebLead request:", leadPayload);

            $.ajax({
                url: globalConfig.LeadManagment,
                type: "POST",
                method: "POST",
                data: JSON.stringify(leadPayload),
                contentType: "application/json",
                processData: false,
                timeout: 15000, // 15 second timeout
                success: function (response) {
                    console.log("AddWebLead data sent successfully:", response);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    // Log error details
                    console.error("AddWebLead error details:");
                    console.error("Status:", textStatus);
                    console.error("Error:", errorThrown);
                    console.error("Status code:", jqXHR.status);

                    try {
                        // Parse response text if available
                        var responseText = jqXHR.responseText;
                        console.error("Response text:", responseText);

                        if (responseText && responseText.length > 0) {
                            try {
                                // Parse as JSON
                                var jsonResponse = JSON.parse(responseText);
                                console.error("Parsed JSON response:", jsonResponse);
                            } catch (e) {
                                console.error("Response is not valid JSON");
                            }
                        }
                    } catch (ex) {
                        console.error("Error processing response:", ex);
                    }
                }
            });
        }

        // Reset submit button to original state
        function resetSubmitButton(button, text) {
            button.textContent = text || "Submit";
            button.disabled = false;
        }

        // Show error alert
        function showErrorAlert(messageElement) {
            if (!messageElement) return;

            var alertHtml = `  
		<div class="alert-container">
			<div class="alert alert-danger" role="alert">
				Something went wrong! Please try again later.
			</div>
		</div>
		`;

            messageElement.innerHTML = alertHtml;
            setTimeout(function () {
                messageElement.innerHTML = "";
            }, 6000);
        }

        // Add fallback image handling for all flag images
        document.addEventListener('DOMContentLoaded', function () {
            // Add event listener to handle all flag image errors
            document.body.addEventListener('error', function (e) {
                if (e.target.tagName.toLowerCase() === 'img' && e.target.classList.contains('flag-icon')) {
                    handleImageError(e.target);
                }
            }, true);
        });
        $(document).ready(function () {
            console.log("Country code dropdown initialized");
        });
    </script>
</body>
